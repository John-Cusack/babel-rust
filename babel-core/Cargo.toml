[package]
name = "babel-core"
version = "2.18.0"
edition = "2021"
description = "Rust core of the python-babel formatting hot path (no Python dependency)"
license = "BSD-3-Clause"
repository = "https://github.com/John-Cusack/babel-rust"

[lib]
name = "babel_core"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
