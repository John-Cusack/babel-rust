[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "babel-rust"
version = "2.18.0"
description = "Rust port of the python-babel formatting hot path (drop-in mirror, same import name)"
authors = [{ name = "babel-rust contributors" }]
maintainers = [{ name = "babel-rust publishers" }]
requires-python = ">=3.10"
readme = "README.md"
license = "BSD-3-Clause"
keywords = ["babel", "i18n", "l10n", "rust"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "License :: OSI Approved :: BSD License",
  "Topic :: Software :: Libraries :: Python Modules",
  "Topic :: Software :: Localization",
]

[project.urls]
Homepage = "https://github.com/John-Cusack/babel-rust"
Upstream = "https://github.com/python-babel/babel"

[tool.maturin]
module-name = "babel._core"
bindings = "pyo3"
features = ["pyo3/extension-module"]
sdist-include = ["babel-core/**/*", "NOTICE", "LICENSE.unicode", "babel/_rust.py"]

[tool.pytest.ini_options]
testpaths = ["tests", "babel"]
doctest_optionflags = [
    "ELLIPSIS",
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
]
markers = [
    "all_locales: parameterize test with all locales"
]
filterwarnings = [
    "ignore:babel.numbers.format_decimal:DeprecationWarning",
    "ignore:.*FixedOffsetTimezone:DeprecationWarning",
]
